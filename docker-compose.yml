# Webtree Site Generator — local dev compose (app only).
#
# The model is NOT part of this stack. It is served by ai-server/, an
# independent Compose project with its own lifecycle (./ai-server/ai.sh), so the
# app can restart without unloading a 24GB model and the AI box can live on
# different hardware entirely.
#
# The backend reaches it through ONE variable, LLM_BASE_URL, which covers every
# deployment without a compose edit:
#   - ai-server container on this host (default): http://host.docker.internal:11434
#   - a host-native runtime (Windows Ollama, LM Studio, MLX on a Mac): same form,
#     different port
#   - a remote AI box over Tailscale: http://<tailnet-name-or-ip>:11434
# Which engine and which model sit behind that URL is decided in ai-server/.env.

services:
  backend:
    build:
      context: ./backend
    container_name: webtree-sitegen-backend
    ports:
      - "8001:8001"
    # Every setting in backend/app/config.py flows straight from the root .env
    # (pydantic's own env_file=".env" is CWD-relative, so it doesn't fire inside
    # the container). New knobs need no compose edit — see .env.example for the
    # full catalogue.
    env_file:
      - path: .env
        required: false
    environment:
      # Only the container-networking rewrites live here (environment beats
      # env_file): in-container, "localhost" URLs from a host-context .env must
      # point at host.docker.internal instead. Each uses ${VAR:-default}
      # interpolation so a .env pointing at a REMOTE server (an AI box over
      # Tailscale) passes through instead of being clobbered.
      # NOTE: server root, no /v1 suffix — the client appends the OpenAI paths.
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434}"
      CMS_API_BASE_URL: "${CMS_API_BASE_URL:-http://host.docker.internal:8000}"
    extra_hosts:
      # Required on Linux; harmless on macOS where it's already provided.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - sitegen_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: webtree-sitegen-frontend
    ports:
      - "5174:5174"
    environment:
      # Vite proxy target — see frontend/vite.config.ts
      BACKEND_URL: "http://backend:8001"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Anonymous volume keeps node_modules from the host out of the container.
      - /app/node_modules

volumes:
  sitegen_data:
