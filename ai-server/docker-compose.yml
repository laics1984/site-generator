# Webtree AI server — the ONLY place that knows how and where a model runs.
#
# The site-generator backend knows a single thing: LLM_BASE_URL. Everything else
# — which engine, which model, quantization, context length, keep-alive, GPU
# offload — lives here. Swapping Qwen for DeepSeek/GLM/Kimi is one line in
# ai-server/.env; the backend needs no edit and no restart.
#
# Engines are Compose profiles, selected by LLM_ENGINE in ai-server/.env:
#   ollama    — default. Easiest model swapping (registry tags, auto load/unload).
#   llamacpp  — manual control of the GPU/CPU split (--n-cpu-moe) and sampling.
#   mlx       — Apple Silicon only, host-native (no container exists). ai.sh runs it.
#   external  — a remote box / Windows-native runtime. Nothing to start here.
#
# Never run `docker compose` here directly — use ./ai.sh, which selects the right
# profile and overlay and waits for readiness. For tailnet access see
# docker-compose.tailscale.yml.
#
# Every engine serves the SAME contract to the backend: an OpenAI-compatible
# /v1/chat/completions + /v1/models. That uniformity is what lets the backend
# hold one URL and no engine knowledge.

name: webtree-ai

services:
  # --- Ollama -----------------------------------------------------------------
  # Model management by registry tag: `ollama pull <tag>` (done by ai.sh, not a
  # sidecar, so `./ai.sh pull` works on an already-running server too).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: webtree-ai-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Model blobs live here — survives image updates. A 35B MoE Q4 is ~24GB.
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      # Context length is a SERVER setting now. The OpenAI wire has no per-request
      # num_ctx (Ollama's native /api/chat had one), so this single value must
      # cover the largest backend call — the scaffolded content batches.
      OLLAMA_CONTEXT_LENGTH: "${LLM_CTX:-16384}"
      # Keep the model resident between the brand-detection and generation calls;
      # a cold reload of ~24GB in between would blow the backend's read timeout.
      OLLAMA_KEEP_ALIVE: "${LLM_KEEP_ALIVE:-30m}"
      # One model at a time: a 24GB model already overflows 16GB VRAM, so letting
      # a second one load would push both into thrashing.
      OLLAMA_MAX_LOADED_MODELS: "1"
      # The backend generates strictly serially (scaffold_batch_concurrency=1),
      # so parallel slots would only split the KV cache for no gain.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      # Halves KV cache VRAM vs f16 — worth it when ~9GB of experts already has
      # to spill to system RAM.
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    healthcheck:
      # The ollama CLI ships in the image, so no curl dependency.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- llama.cpp --------------------------------------------------------------
  # Qwen3.6-35B-A3B Q4 is ~22GB against a 16GB card. -ngl 999 puts every layer on
  # the GPU, then --n-cpu-moe walks the MoE *expert* tensors of the first N layers
  # back to CPU RAM, keeping attention + KV cache on the GPU. Tune N via
  # ai-server/.env (see README §C) — no YAML edit needed.
  #
  # This is a MANUAL version of what Ollama >=0.32 now does automatically (its
  # fitter overflows expert tensor parts, not whole layers — measured on this box:
  # 12.5GB GPU / 9.5GB CPU, 41/42 layers, ~2GB VRAM left unused). The win here is
  # reclaiming that headroom by hand; it is not free speed. Benchmark both.
  llamacpp:
    profiles: ["llamacpp"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: webtree-ai-llamacpp
    restart: unless-stopped
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    volumes:
      # -hf downloads land here; survives image updates.
      - llama_cache:/root/.cache/llama.cpp
    # No healthcheck: this image is not guaranteed to ship a curl/wget CLI, and a
    # probe that depends on a shell the image may not have would report unhealthy
    # on a perfectly good server. ai.sh polls /v1/models from the host instead —
    # the same check the backend depends on.
    command: >
      -hf ${LLM_HF_REPO:-unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M}
      --alias ${LLM_ALIAS:-qwen3.6-35b-a3b}
      --host 0.0.0.0 --port 8080
      -ngl 999
      --n-cpu-moe ${LLM_N_CPU_MOE:-14}
      -c ${LLM_CTX:-16384}
      -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja
      ${LLAMACPP_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models:
  llama_cache:
